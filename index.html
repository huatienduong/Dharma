<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon tĩnh đơn giản — không dùng logo động -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b45309'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Trợ lý Phật học</title>
    <style>
      /* Chống zoom: giữ khung ứng dụng ổn định (pinch / double-tap / ctrl+wheel) */
      html,
      body {
        overscroll-behavior: none;
        touch-action: pan-x pan-y;
        margin: 0;
        background: #ffffff;
      }
      #root {
        min-height: 100dvh;
      }
    </style>
    <script>
      // Chặn mọi thao tác zoom của người dùng (pinch, ctrl+wheel, phím tắt)
      (function () {
        var stop = function (e) {
          e.preventDefault();
        };
        document.addEventListener("gesturestart", stop, { passive: false });
        document.addEventListener("gesturechange", stop, { passive: false });
        document.addEventListener("gestureend", stop, { passive: false });
        document.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey || e.metaKey) e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "dblclick",
          function (e) {
            if (e.target.closest("input, textarea")) return;
            e.preventDefault();
          },
          { passive: false },
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Nếu chunk JS cũ bị 404 sau khi phiên bản mới phát hành → tự tải lại
      // trang một lần để nhận bundle mới (khắc phục trắng trang).
      window.addEventListener("error", function (e) {
        var src = e && e.target && (e.target.src || e.target.href);
        if (!src || !/\.js(\?|$)/.test(src)) return;
        if (sessionStorage.getItem("ds-chunk-retry")) return;
        sessionStorage.setItem("ds-chunk-retry", "1");
        window.location.reload();
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        var msg = String((e && e.reason && e.reason.message) || "");
        if (!/Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported/i.test(msg)) return;
        if (sessionStorage.getItem("ds-chunk-retry")) return;
        sessionStorage.setItem("ds-chunk-retry", "1");
        window.location.reload();
      });
      // Không còn màn chờ logo — giữ stub để main.tsx gọi an toàn.
      window.__dsBootDone = function () {};
    </script>
  </body>
</html>
