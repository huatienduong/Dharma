    <title>Trợ lý Phật học</title>
    <style>
      /* Chặn hoàn toàn thu phóng: khung ứng dụng cố định, không pinch,
         không double-tap zoom — ngăn công cụ/thiết bị bên thứ ba can thiệp
         giao diện. Người lớn tuổi dùng Cỡ chữ trong Cài đặt để phóng chữ. */
      html,
      body {
        overscroll-behavior: none;
        touch-action: pan-x pan-y;
        margin: 0;
        background: #faf6ef;
      }
      #root {
        min-height: 100dvh;
      }
    </style>
    <script>
      // Chặn mọi thao tác zoom của người dùng (pinch, ctrl+wheel, phím tắt)
      (function () {
        var stop = function (e) {
          e.preventDefault();
        };
        document.addEventListener("gesturestart", stop, { passive: false });
        document.addEventListener("gesturechange", stop, { passive: false });
        document.addEventListener("gestureend", stop, { passive: false });
        document.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey || e.metaKey) e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "dblclick",
          function (e) {
            if (e.target.closest("input, textarea")) return;
            e.preventDefault();
          },
          { passive: false },
        );
        // Chặn phím tắt zoom (Ctrl +/−/0) — phủ kín mọi đường thu phóng
        document.addEventListener(
          "keydown",
          function (e) {
            if (
              (e.ctrlKey || e.metaKey) &&
              (e.key === "+" ||
                e.key === "-" ||
                e.key === "=" ||
                e.key === "0" ||
                e.key === "_")
            ) {
              e.preventDefault();
            }
          },
          { passive: false },
        );
      })();
      // Zoom bị chặn HOÀN TOÀN: viewport user-scalable=no + touch-action
      // pan-x/pan-y + các listener ở trên (pinch, ctrl+wheel, double-tap).
    </script>

  <body>

    <script>
      // Nếu chunk JS cũ bị 404 sau khi phiên bản mới phát hành → tự tải lại
      // trang một lần để nhận bundle mới (khắc phục trắng trang).
      window.addEventListener("error", function (e) {
        var src = e && e.target && (e.target.src || e.target.href);
        if (!src || !/\.js(\?|$)/.test(src)) return;
        if (sessionStorage.getItem("ds-chunk-retry")) return;
        sessionStorage.setItem("ds-chunk-retry", "1");
        window.location.reload();
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        var msg = String((e && e.reason && e.reason.message) || "");
        if (!/Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported/i.test(msg)) return;
        if (sessionStorage.getItem("ds-chunk-retry")) return;
        sessionStorage.setItem("ds-chunk-retry", "1");
        window.location.reload();
      });
      // Không còn màn chờ logo — giữ stub để main.tsx gọi an toàn.
      window.__dsBootDone = function () {};
    </script>
