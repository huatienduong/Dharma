    <style>
      /* Chặn hoàn toàn thu phóng: khung ứng dụng cố định, không pinch,
         không double-tap zoom — ngăn công cụ/thiết bị bên thứ ba can thiệp
         giao diện. Người lớn tuổi dùng Cỡ chữ trong Cài đặt để phóng chữ. */
      html,
      body {
        overscroll-behavior: none;
        touch-action: pan-x pan-y;
        margin: 0;
        background: #ffffff;
      }
      #root {
        min-height: 100dvh;
      }
    </style>
    <script>
      // Chặn mọi thao tác zoom của người dùng (pinch, ctrl+wheel, phím tắt)
      (function () {
        var stop = function (e) {
          e.preventDefault();
        };
        document.addEventListener("gesturestart", stop, { passive: false });
        document.addEventListener("gesturechange", stop, { passive: false });
        document.addEventListener("gestureend", stop, { passive: false });
        document.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey || e.metaKey) e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "dblclick",
          function (e) {
            if (e.target.closest("input, textarea")) return;
            e.preventDefault();
          },
          { passive: false },
        );
        // Chặn phím tắt zoom (Ctrl +/−/0) — phủ kín mọi đường thu phóng
        document.addEventListener(
          "keydown",
          function (e) {
            if (
              (e.ctrlKey || e.metaKey) &&
              (e.key === "+" ||
                e.key === "-" ||
                e.key === "=" ||
                e.key === "0" ||
                e.key === "_")
            ) {
              e.preventDefault();
            }
          },
          { passive: false },
        );
      })();
      // Zoom bị chặn HOÀN TOÀN: viewport user-scalable=no + touch-action
      // pan-x/pan-y + các listener ở trên (pinch, ctrl+wheel, double-tap).
    </script>

    <script>
      // PHÒNG CHỐNG APP CHẾT VĨNH VIỄN SAU KHI PHÁT HÀNH PHIÊN BẢN MỚI.
      //
      // Trước đây: chunk JS cũ bị 404 → reload một lần. Nhưng service worker
      // vẫn trả đúng bản HTML cũ đã cache, nên lần reload sau vẫn hỏng, cờ
      // "đã thử" lại chặn lần nữa → app chết hẳn tới cuối phiên làm việc.
      //
      // Nay: khi phát hiện lỗi tải chunk, xoá service worker + toàn bộ cache
      // rồi mới reload, và cho phép tự cứu tới 2 lần. Lần khởi động thành công
      // sẽ xoá cờ để lần phát hành sau cũng được cứu như thường.
      (function () {
        var KEY = "ds-chunk-retry";
        var MAX = 2;

        function recover() {
          var tries = Number(sessionStorage.getItem(KEY) || "0");
          if (tries >= MAX) return;
          sessionStorage.setItem(KEY, String(tries + 1));
          var reload = function () {
            window.location.reload();
          };
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) {
                  r.unregister();
                });
                if (window.caches && caches.keys) {
                  return caches.keys().then(function (keys) {
                    return Promise.all(
                      keys.map(function (k) {
                        return caches.delete(k);
                      })
                    );
                  });
                }
              }).then(reload, reload);
              return;
            }
          } catch (e) {
            /* bỏ qua, vẫn reload */
          }
          reload();
        }

        window.addEventListener(
          "error",
          function (e) {
            var src = e && e.target && (e.target.src || e.target.href);
            if (!src || !/\.js(\?|$)/.test(src)) return;
            recover();
          },
          true
        );
        window.addEventListener("unhandledrejection", function (e) {
          var msg = String((e && e.reason && e.reason.message) || "");
          if (
            !/Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported/i.test(
              msg
            )
          )
            return;
          recover();
        });

        // App đã khởi động tốt → cho phép tự cứu ở lần phát hành kế tiếp.
        window.__dsBootDone = function () {
          try {
            sessionStorage.removeItem(KEY);
          } catch (e) {
            /* noop */
          }
        };
      })();
    </script>
