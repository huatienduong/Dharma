<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon động: dùng logo chính thức chủ app tải lên (cache qua localStorage) -->
    <link id="app-favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b45309'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var cached = localStorage.getItem("dharma-logo-url");
          if (cached) document.getElementById("app-favicon").href = cached;
        } catch (e) { /* bỏ qua */ }
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <style>
      /* Chống zoom: giữ khung ứng dụng ổn định (pinch / double-tap / ctrl+wheel) */
      html,
      body {
        overscroll-behavior: none;
        touch-action: pan-x pan-y;
      }
      #root {
        min-height: 100dvh;
      }
    </style>
    <script>
      // Chặn mọi thao tác zoom của người dùng (pinch, ctrl+wheel, phím tắt)
      (function () {
        var stop = function (e) {
          e.preventDefault();
        };
        document.addEventListener("gesturestart", stop, { passive: false });
        document.addEventListener("gesturechange", stop, { passive: false });
        document.addEventListener("gestureend", stop, { passive: false });
        document.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey || e.metaKey) e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "dblclick",
          function (e) {
            if (e.target.closest("input, textarea")) return;
            e.preventDefault();
          },
          { passive: false },
        );
      })();
    </script>

  </head>    <body>
      <!-- Màn chờ tĩnh: hiển thị NGAY LOGO chính thức khi mở app (không chữ DHARMA,
           không chữ loading). Ảnh lấy từ Convex Storage — lần mở sau lấy từ cache. -->
      <div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ffffff;z-index:9999">
        <img
          id="boot-logo"
          alt=""
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%23b45309' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23b45309'/%3E%3Cg stroke='%23b45309' stroke-width='3'%3E%3Cline x1='32' y1='6' x2='32' y2='58'/%3E%3Cline x1='6' y1='32' x2='58' y2='32'/%3E%3Cline x1='14' y1='14' x2='50' y2='50'/%3E%3Cline x1='50' y1='14' x2='14' y2='50'/%3E%3C/g%3E%3C/svg%3E"
          style="width:96px;height:96px;object-fit:contain;border-radius:24px"
        />
      </div>
      <script>
        (function () {
          var img = document.getElementById("boot-logo");
          var hide = function () { var b = document.getElementById("boot"); if (b) b.remove(); };
          try {
            var cached = localStorage.getItem("dharma-logo-url");
            if (cached && img) img.src = cached;
          } catch (e) { /* bỏ qua */ }
          // Không có logo cache hoặc ảnh lỗi → ẩn màn chờ luôn, không chờ chữ
          if (img) {
            img.addEventListener("load", hide);
            img.addEventListener("error", hide);
          }
          setTimeout(hide, 1500);
        })();
      </script>
    <div id="root"></div>
    <script>
      // Nếu chunk JS cũ bị 404 sau khi phiên bản mới phát hành → tự tải lại
      // trang một lần để nhận bundle mới (khắc phục trắng trang).
      window.addEventListener("error", function (e) {
        var src = e && e.target && (e.target.src || e.target.href);
        if (!src || !/\.js(\?|$)/.test(src)) return;
        if (sessionStorage.getItem("ds-chunk-retry")) return;
        sessionStorage.setItem("ds-chunk-retry", "1");
        window.location.reload();
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        var msg = String((e && e.reason && e.reason.message) || "");
        if (!/Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported/i.test(msg)) return;
        if (sessionStorage.getItem("ds-chunk-retry")) return;
        sessionStorage.setItem("ds-chunk-retry", "1");
        window.location.reload();
      });
      // Gỡ màn boot khi React đã render nội dung thật (main.tsx gọi
      // window.__dsBootDone()) hoặc sau 4s tối đa — không dựa vào sự kiện
      // load vì script YouTube có thể trì hoãn nó.
      window.__dsBootDone = function () {
        var boot = document.getElementById("boot");
        if (boot) boot.remove();
      };
      setTimeout(window.__dsBootDone, 4000);
    </script>
  </body>
