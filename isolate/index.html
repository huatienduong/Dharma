    <style>
      /* Chống zoom: giữ khung ứng dụng ổn định (pinch / double-tap / ctrl+wheel) */
      html,
      body {
        overscroll-behavior: none;
        touch-action: pan-x pan-y;
      }
      #root {
        min-height: 100dvh;
      }
    </style>
    <script>
      // Chặn mọi thao tác zoom của người dùng (pinch, ctrl+wheel, phím tắt)
      (function () {
        var stop = function (e) {
          e.preventDefault();
        };
        document.addEventListener("gesturestart", stop, { passive: false });
        document.addEventListener("gesturechange", stop, { passive: false });
        document.addEventListener("gestureend", stop, { passive: false });
        document.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey || e.metaKey) e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener(
          "dblclick",
          function (e) {
            if (e.target.closest("input, textarea")) return;
            e.preventDefault();
          },
          { passive: false },
        );
      })();
    </script>

    <!-- Màn chờ tĩnh: hiển thị ngay lập tức, che trắng trang khi chunk JS tải lỗi/chậm -->
    <div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ffffff;z-index:9999">
      <div style="text-align:center;font-family:system-ui,sans-serif">
        <div style="font-size:24px;font-weight:700;letter-spacing:-0.5px;color:#1c1917">Dharma</div>

      </div>
    </div>
    <div id="root"></div>
    <script>
      // Nếu chunk JS cũ bị 404 sau khi phiên bản mới phát hành → tự tải lại
      // trang một lần để nhận bundle mới (khắc phục trắng trang).
      window.addEventListener("error", function (e) {
        var src = e && e.target && (e.target.src || e.target.href);
        if (!src || !/\.js(\?|$)/.test(src)) return;
        if (sessionStorage.getItem("ds-chunk-retry")) return;
        sessionStorage.setItem("ds-chunk-retry", "1");
        window.location.reload();
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        var msg = String((e && e.reason && e.reason.message) || "");
        if (!/Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported/i.test(msg)) return;
        if (sessionStorage.getItem("ds-chunk-retry")) return;
        sessionStorage.setItem("ds-chunk-retry", "1");
        window.location.reload();
      });
      // Gỡ màn boot khi React đã render nội dung thật (main.tsx gọi
      // window.__dsBootDone()) hoặc sau 4s tối đa — không dựa vào sự kiện
      // load vì script YouTube có thể trì hoãn nó.
      window.__dsBootDone = function () {
        var boot = document.getElementById("boot");
        if (boot) boot.remove();
      };
      setTimeout(window.__dsBootDone, 4000);
    </script>
